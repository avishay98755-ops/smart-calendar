
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calendar</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8fafd;
  color: #202124;
}

header {
  background: white;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 5;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #4285f4;
}

.today-btn, .add-btn {
  border: none;
  border-radius: 22px;
  padding: 11px 17px;
  cursor: pointer;
  font-size: 14px;
}

.today-btn {
  background: #e8f0fe;
  color: #1967d2;
}

.add-btn {
  background: #1a73e8;
  color: white;
  font-size: 16px;
}

.container {
  max-width: 850px;
  margin: 22px auto;
  padding: 12px;
}

.month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.month-header h2 {
  font-size: 23px;
  margin: 0;
}

.nav button {
  background: white;
  border: 1px solid #ddd;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 20px;
  cursor: pointer;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  overflow: hidden;
}

.weekday {
  text-align: center;
  padding: 13px 2px;
  color: #5f6368;
  font-size: 12px;
  border-bottom: 1px solid #eee;
}

.day {
  min-height: 76px;
  border: none;
  border-left: 1px solid #eee;
  border-bottom: 1px solid #eee;
  background: white;
  position: relative;
  cursor: pointer;
  font-size: 14px;
  color: #202124;
}

.day:active { background: #e8f0fe; }

.day.empty { cursor: default; }

.day.selected {
  background: #e8f0fe;
  color: #1967d2;
  font-weight: bold;
}

.day.today .number {
  background: #1a73e8;
  color: white;
  border-radius: 50%;
  padding: 5px 8px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #1a73e8;
  border-radius: 50%;
  display: inline-block;
  margin: 3px 1px;
}

.events-section {
  background: white;
  border-radius: 13px;
  padding: 18px;
  margin-top: 20px;
  border: 1px solid #eee;
}

.events-section h3 { margin-top: 0; }

.event {
  padding: 12px;
  border-right: 4px solid #4285f4;
  background: #f1f5fe;
  border-radius: 7px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.event-info { min-width: 0; }

.event-title {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.event-time {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

.delete-btn {
  border: none;
  background: transparent;
  color: #d93025;
  font-size: 18px;
  cursor: pointer;
}

.form {
  display: none;
  background: white;
  padding: 18px;
  border-radius: 13px;
  margin-top: 20px;
  border: 1px solid #ddd;
}

.form h3 { margin-top: 0; }

.form input {
  width: 100%;
  padding: 13px;
  margin: 7px 0 13px;
  border: 1px solid #dadce0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
}

.form label {
  font-size: 14px;
  color: #555;
}

.save-btn {
  width: 100%;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 13px;
  font-size: 16px;
  cursor: pointer;
}

.cancel-btn {
  width: 100%;
  background: #f1f3f4;
  border: none;
  padding: 12px;
  border-radius: 8px;
  margin-top: 8px;
  cursor: pointer;
}

.empty {
  color: #777;
  text-align: center;
  padding: 20px;
}

@media(max-width: 450px) {
  .day { min-height: 61px; }
  .container { padding: 8px; }
  .month-header h2 { font-size: 19px; }
  header { padding: 13px; }
}
</style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
</head>

<body>

<header>
  <div class="logo">📅 Smart Calendar</div>
  <button class="today-btn" onclick="goToday()">היום</button>
</header>

<div class="container">

  <div style="display:flex;gap:10px;margin-bottom:15px">
  <button class="today-btn" onclick="showMonthView()">
    📅 חודש
  </button>

  <button class="today-btn" onclick="showDayView()">
    🕒 היום שלי
  </button>
</div>

<div id="daySchedule" style="display:none"></div>
  <div class="month-header">
    <div class="nav">
      <button onclick="changeMonth(-1)">›</button>
      <button onclick="changeMonth(1)">‹</button>
    </div>
    <h2 id="monthTitle"></h2>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="events-section">
    <h3 id="selectedTitle"></h3>
    <div id="eventsList"></div>
  </div>

  <div class="events-section" style="margin-top:20px">
  <h3>✅ המשימות שלי</h3>

  <div id="taskProgress" style="margin-bottom:14px;color:#5f6368">
    ההתקדמות היומית: 0%
  </div>

  <div style="height:9px;background:#e8eaed;border-radius:10px;overflow:hidden;margin-bottom:18px">
    <div id="progressBar" style="height:100%;width:0%;background:#34a853;transition:width .3s"></div>
  </div>

  <div id="tasksList"></div>

  <button class="add-btn" style="margin-top:12px"
    onclick="toggleTaskForm(true)">
    ＋ הוסף משימה
  </button>

  <div id="taskForm" style="display:none;margin-top:18px">
    <h3>משימה חדשה</h3>

    <label>מה צריך לעשות?</label>
    <input id="taskName" type="text" placeholder="לדוגמה: להכין שיעורי בית">

    <label>תאריך</label>
    <input id="taskDate" type="date">

    <label>שעה (לא חובה)</label>
    <input id="taskTime" type="time">

    <label>עדיפות</label>
    <select id="taskPriority" style="width:100%;padding:12px;margin:8px 0 15px;border:1px solid #dadce0;border-radius:8px;font-size:15px">
      <option value="high">🔴 גבוהה</option>
      <option value="medium" selected>🟡 בינונית</option>
      <option value="low">🟢 נמוכה</option>
    </select>

    <button class="save-btn" onclick="saveTask()">שמור משימה</button>
    <button class="cancel-btn" onclick="toggleTaskForm(false)">ביטול</button>
  </div>
  </div>

  <button class="add-btn" style="margin-top:18px"
    onclick="toggleForm(true)">
    ＋ הוסף אירוע
  </button>

  <div class="form" id="eventForm">
    <h3>אירוע חדש</h3>

    <label>שם האירוע</label>
    <input id="eventName" type="text" placeholder="לדוגמה: אימון כדורסל">

    <label>תאריך</label>
    <input id="eventDate" type="date">

    <label>שעה</label>
    <input id="eventTime" type="time">

    <button class="save-btn" onclick="saveEvent()">שמור אירוע</button>
    <button class="cancel-btn" onclick="toggleForm(false)">ביטול</button>
  </div>

</div>

<script>
const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedDate = dateKey(today);

let events = JSON.parse(
  localStorage.getItem("smartCalendarEvents") || "[]"
);

const weekdays = [
  "ראשון", "שני", "שלישי",
  "רביעי", "חמישי", "שישי", "שבת"
];

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function saveStorage() {
  localStorage.setItem(
    "smartCalendarEvents",
    JSON.stringify(events)
  );
}

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const monthName = new Date(
    currentYear, currentMonth, 1
  ).toLocaleDateString("he-IL", {
    month: "long",
    year: "numeric"
  });

  document.getElementById("monthTitle").textContent =
    monthName;

  weekdays.forEach(day => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = day;
    calendar.appendChild(el);
  });

  const firstDay = new Date(
    currentYear, currentMonth, 1
  ).getDay();

  const daysInMonth = new Date(
    currentYear, currentMonth + 1, 0
  ).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const key = dateKey(
      new Date(currentYear, currentMonth, day)
    );

    const el = document.createElement("button");
    el.className = "day";

    if (key === selectedDate) el.classList.add("selected");
    if (key === dateKey(today)) el.classList.add("today");

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = day;
    el.appendChild(number);

    const count = events.filter(e => e.date === key).length;

    if (count > 0) {
      const dots = document.createElement("div");
      for (let i = 0; i < Math.min(count, 3); i++) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dots.appendChild(dot);
      }
      el.appendChild(dots);
    }

    el.onclick = () => {
      selectedDate = key;
      renderCalendar();
      renderEvents();
    };

    calendar.appendChild(el);
  }

  renderEvents();
renderTasks();
}

function renderEvents() {
  const list = document.getElementById("eventsList");

  const date = new Date(selectedDate + "T12:00:00");

  document.getElementById("selectedTitle").textContent =
    "אירועים ליום " + date.toLocaleDateString("he-IL", {
      day: "numeric",
      month: "long"
    });

  list.innerHTML = "";

  const dayEvents = events
    .filter(e => e.date === selectedDate)
    .sort((a, b) => a.time.localeCompare(b.time));

  if (dayEvents.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "אין אירועים ביום הזה 🌤️";
    list.appendChild(empty);
    return;
  }

  dayEvents.forEach(event => {
    const item = document.createElement("div");
    item.className = "event";

    const info = document.createElement("div");
    info.className = "event-info";

    const title = document.createElement("div");
    title.className = "event-title";
    title.textContent = event.name;

    const time = document.createElement("div");
    time.className = "event-time";
    time.textContent = event.time || "ללא שעה";

    info.append(title, time);

    const del = document.createElement("button");
    del.className = "delete-btn";
    del.textContent = "✕";
    del.setAttribute("aria-label", "מחק אירוע");

    del.onclick = () => {
      if (confirm("למחוק את האירוע?")) {
        events = events.filter(e => e.id !== event.id);
        saveStorage();
        renderCalendar();
      }
    };

    item.append(info, del);
    list.appendChild(item);
  });
}

function changeMonth(amount) {
  currentMonth += amount;

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  renderCalendar();
}

function goToday() {
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  selectedDate = dateKey(today);
  renderCalendar();
}

function toggleForm(show) {
  document.getElementById("eventForm").style.display =
    show ? "block" : "none";

  if (show) {
    document.getElementById("eventDate").value =
      selectedDate;
    document.getElementById("eventName").focus();
  }
}

function saveEvent() {
  const name = document.getElementById("eventName").value.trim();
  const date = document.getElementById("eventDate").value;
  const time = document.getElementById("eventTime").value;

  if (!name || !date) {
    alert("צריך למלא שם אירוע ותאריך");
    return;
  }

  events.push({
    id: Date.now() + Math.random(),
    name,
    date,
    time
  });

  saveStorage();

  selectedDate = date;

  const parts = date.split("-").map(Number);
  currentYear = parts[0];
  currentMonth = parts[1] - 1;

  document.getElementById("eventName").value = "";
  document.getElementById("eventTime").value = "";

  toggleForm(false);
  renderCalendar();
}


let tasks = JSON.parse(
  localStorage.getItem("smartCalendarTasks") || "[]"
);

function saveTasksStorage() {
  localStorage.setItem(
    "smartCalendarTasks",
    JSON.stringify(tasks)
  );
}

function toggleTaskForm(show) {
  document.getElementById("taskForm").style.display =
    show ? "block" : "none";

  if (show) {
    document.getElementById("taskDate").value = selectedDate;
    document.getElementById("taskName").focus();
  }
}

function saveTask() {
  const name = document.getElementById("taskName").value.trim();
  const date = document.getElementById("taskDate").value;
  const time = document.getElementById("taskTime").value;
  const priority = document.getElementById("taskPriority").value;

  if (!name || !date) {
    alert("צריך למלא שם משימה ותאריך");
    return;
  }

  tasks.push({
    id: Date.now() + Math.random(),
    name,
    date,
    time,
    priority,
    completed: false
  });

  saveTasksStorage();

  selectedDate = date;
  const parts = date.split("-").map(Number);
  currentYear = parts[0];
  currentMonth = parts[1] - 1;

  document.getElementById("taskName").value = "";
  document.getElementById("taskTime").value = "";

  toggleTaskForm(false);
  renderCalendar();
}

function renderTasks() {
  const list = document.getElementById("tasksList");

  const dayTasks = tasks
    .filter(task => task.date === selectedDate)
    .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

  list.innerHTML = "";

  const completed = dayTasks.filter(t => t.completed).length;
  const percent = dayTasks.length
    ? Math.round(completed / dayTasks.length * 100)
    : 0;

  document.getElementById("taskProgress").textContent =
    `ההתקדמות היומית: ${percent}% (${completed}/${dayTasks.length})`;

  document.getElementById("progressBar").style.width =
    percent + "%";

  if (dayTasks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "אין משימות ליום הזה 🎯";
    list.appendChild(empty);
    return;
  }

  dayTasks.forEach(task => {
    const item = document.createElement("div");
    item.style.cssText =
      "display:flex;align-items:center;gap:10px;padding:13px 5px;border-bottom:1px solid #eee";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;
    checkbox.style.cssText = "width:20px;height:20px;accent-color:#1a73e8";

    checkbox.onchange = () => {
      task.completed = checkbox.checked;
      saveTasksStorage();
      renderTasks();
    };

    const info = document.createElement("div");
    info.style.flex = "1";

    const name = document.createElement("div");
    name.textContent = task.name;
    name.style.fontWeight = "bold";

    if (task.completed) {
      name.style.textDecoration = "line-through";
      name.style.color = "#999";
    }

    const details = document.createElement("div");
    details.style.cssText = "font-size:12px;color:#777;margin-top:5px";

    const priorities = {
      high: "🔴 עדיפות גבוהה",
      medium: "🟡 עדיפות בינונית",
      low: "🟢 עדיפות נמוכה"
    };

    details.textContent =
      (task.time ? task.time + " · " : "") +
      priorities[task.priority];

    info.append(name, details);

    const del = document.createElement("button");
    del.textContent = "✕";
    del.style.cssText =
      "border:0;background:none;color:#d93025;font-size:18px";

    del.onclick = () => {
      if (confirm("למחוק את המשימה?")) {
        tasks = tasks.filter(t => t.id !== task.id);
        saveTasksStorage();
        renderTasks();
      }
    };

    item.append(checkbox, info, del);
    list.appendChild(item);
  });
}

renderCalendar();
renderTasks();

function showMonthView() {
  document.getElementById("calendar").style.display = "grid";
  document.querySelector(".month-header").style.display = "flex";
  document.getElementById("daySchedule").style.display = "none";
  document.querySelector(".events-section").style.display = "block";
  document.getElementById("taskForm").style.display = "none";
}

function showDayView() {
  document.getElementById("calendar").style.display = "none";
  document.querySelector(".month-header").style.display = "none";
  document.querySelector(".events-section").style.display = "none";

  const schedule = document.getElementById("daySchedule");
  schedule.style.display = "block";
  schedule.innerHTML = "";

  const date = new Date(selectedDate + "T12:00:00");

  const heading = document.createElement("h2");
  heading.textContent = "🕒 היום שלי – " +
    date.toLocaleDateString("he-IL", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

  schedule.appendChild(heading);

  for (let hour = 6; hour <= 23; hour++) {
    const time = String(hour).padStart(2, "0") + ":00";

    const row = document.createElement("div");
    row.style.cssText =
      "display:flex;gap:12px;min-height:75px;border-top:1px solid #ddd;padding:10px 5px";

    const label = document.createElement("div");
    label.textContent = time;
    label.style.cssText =
      "width:48px;color:#777;font-size:14px";

    const content = document.createElement("div");
    content.style.flex = "1";

    const dayEvents = events.filter(e =>
      e.date === selectedDate &&
      e.time &&
      Number(e.time.split(":")[0]) === hour
    );

    const dayTasks = tasks.filter(t =>
      t.date === selectedDate &&
      t.time &&
      Number(t.time.split(":")[0]) === hour
    );

    [...dayEvents, ...dayTasks].forEach(item => {
      const card = document.createElement("div");
      card.textContent =
        (dayEvents.includes(item) ? "📅 " : "✅ ") +
        item.name +
        (item.time ? " · " + item.time : "");

      card.style.cssText =
        "background:#e8f0fe;border-right:4px solid #4285f4;padding:10px;margin:4px 0;border-radius:7px";

      content.appendChild(card);
    });

    row.append(label, content);
    schedule.appendChild(row);
  }

  const back = document.createElement("button");
  back.className = "today-btn";
  back.textContent = "חזרה ללוח השנה";
  back.style.marginTop = "15px";
  back.onclick = showMonthView;

  schedule.appendChild(back);
}

  
</script>

  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service Worker registered"))
      .catch(error => console.log("Service Worker error:", error));
  });
}
  </script>
</body>
</html>
